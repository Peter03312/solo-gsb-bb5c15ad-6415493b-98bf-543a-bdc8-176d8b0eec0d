<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧场无线话筒频点排演</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🎙️</span>
    <div>
      <h1>剧场无线话筒频点排演</h1>
      <p class="subtitle">同房间 / 互扰房间且时段重叠时，频点差 ≥ 双方保护间隔较大值 · 先保高优先级，再保总数</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="btn-demo" class="btn btn-ghost" type="button">载入演示数据</button>
    <button id="btn-reset" class="btn btn-ghost danger" type="button">清空全部</button>
    <button id="btn-solve" class="btn btn-primary" type="button">▶ 开始编排</button>
  </div>
</header>

<div id="alert-box"></div>

<main class="layout">
  <!-- 左栏：房间与互扰 -->
  <section class="panel">
    <h2>房间与互扰关系</h2>

    <div class="subhead">房间</div>
    <form id="room-form" class="inline-form">
      <input type="text" id="room-name" maxlength="30" placeholder="新房间名称，如：主舞台" required>
      <button class="btn btn-small" type="submit">添加房间</button>
    </form>
    <ul id="room-list" class="item-list"></ul>

    <div class="subhead">互扰房间对（同房间天然互扰，无需录入）</div>
    <form id="interf-form" class="inline-form">
      <select id="interf-a"></select>
      <span class="tilde">↔</span>
      <select id="interf-b"></select>
      <button class="btn btn-small" type="submit">添加互扰</button>
    </form>
    <ul id="interf-list" class="item-list"></ul>
  </section>

  <!-- 中栏：话筒 -->
  <section class="panel wide">
    <h2>话筒设备</h2>
    <form id="mic-form" class="mic-form">
      <input type="hidden" id="mic-id">
      <div class="form-grid">
        <label>名称
          <input type="text" id="mic-name" maxlength="40" required placeholder="如：主持1号">
        </label>
        <label>所在房间
          <select id="mic-room"></select>
        </label>
        <label>保护间隔(kHz)
          <input type="number" id="mic-guard" min="0" step="1" value="25" required>
        </label>
        <label>启用开始
          <input type="time" id="mic-start" value="19:00" required>
        </label>
        <label>启用结束 <small>[开始,结束)</small>
          <input type="time" id="mic-end" value="22:00" required>
        </label>
        <label>优先级
          <select id="mic-priority">
            <option value="high">高</option>
            <option value="normal" selected>普通</option>
          </select>
        </label>
        <label class="full">可用频点(kHz，整数，逗号分隔)
          <input type="text" id="mic-freqs" required placeholder="例如：580, 605, 645">
        </label>
        <label class="check-label">
          <input type="checkbox" id="mic-locked"> 锁定频点
        </label>
        <label id="locked-freq-wrap" class="hidden">锁定频点(kHz)
          <select id="mic-locked-freq"></select>
        </label>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-small" id="mic-submit">添加话筒</button>
        <button type="button" class="btn btn-small btn-ghost hidden" id="mic-cancel">取消编辑</button>
      </div>
    </form>

    <div class="table-wrap">
      <table id="mic-table">
        <thead>
          <tr>
            <th>名称</th><th>房间</th><th>保护(kHz)</th><th>时段</th>
            <th>优先级</th><th>可用频点(kHz)</th><th>锁定</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 右栏：编排结果 -->
  <section class="panel wide">
    <h2>编排结果</h2>
    <div id="solution-area"><p class="hint">尚未编排。录入房间与话筒后点击右上角「开始编排」。</p></div>
  </section>

  <!-- 现场执行核验 -->
  <section class="panel wide">
    <div class="verif-head">
      <h2>现场执行核验</h2>
      <button id="btn-verif-start" class="btn btn-small" type="button">🔒 从最新方案开启核验</button>
    </div>
    <p class="hint" style="margin:4px 0 10px">
      只能从<strong>最新且未过期</strong>的方案开启；开启瞬间冻结方案分配、话筒属性、房间互扰与可用频点，此后录入变更不影响该次核验。
    </p>
    <div id="verif-list" class="verif-list"></div>
    <div id="verif-detail"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
